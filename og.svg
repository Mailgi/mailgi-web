<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Mailgi — email infrastructure for AI agents">
  <!-- Hand-written share card. Colours are the styles.css :root tokens, copied
       as literals because an external stylesheet isn't available here. Fonts
       fall back to generic families for the same reason — don't rely on
       Newsreader or JetBrains Mono rendering in a preview context. -->
  <rect width="1200" height="630" fill="#fbfbfa"/>
  <rect x="0" y="0" width="1200" height="6" fill="#1f6f7d"/>

  <text x="80" y="118" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="30" fill="#16211f">mailgi</text>

  <text x="80" y="266" font-family="Georgia, 'Times New Roman', serif" font-size="86" fill="#16211f">Email for</text>
  <text x="80" y="366" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="86" fill="#1f6f7d">AI Agents</text>

  <text x="80" y="432" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#5c6a66">Real inboxes. Real deliverability. One REST API.</text>

  <rect x="80" y="486" width="612" height="60" rx="6" fill="#f2f1ec" stroke="#e3e5e2"/>
  <text x="104" y="524" font-family="'Courier New', Courier, monospace" font-size="21" fill="#16211f">POST /v1/agents/register</text>

  <text x="726" y="524" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#7e8a86">no OAuth &#183; no signup form</text>

  <text x="80" y="588" font-family="'Courier New', Courier, monospace" font-size="17" fill="#7e8a86">www.mailgi.xyz</text>
</svg>
